<text x="916" y="463.0" font-size="11" fill="#4A4A4A">Safe margin — 22</text>
<text x="40" y="528" font-size="11.5" fill="#4A4A4A">Indices: row 0 apexes #0–2 · row 1 #3–8 · row 2 #9–17 · bottom row #18–27 (face-up at deal). coveredBy[i] = the two cards directly below-left / below-right; bottom row has none.</text>
<text x="40" y="545" font-size="11.5" fill="#4A4A4A">Horizontal: 10 cards × 74 pt pitch − 4 = 736 pt, centred with 54 pt margins (clears iPhone landscape notch/safe area). Rows 0–2 offset by half a pitch per row, standard TriPeaks stagger.</text>
<text x="40" y="562" font-size="11.5" fill="#4A4A4A">Vertical: 32 pt row pitch leaves 33 % of each buried card visible — enough to read the back pattern but every uncovered card is fully exposed (70 × 98 visual, ≥ 74 × 98 hit cell — pink dashed outline on #18).</text>
<text x="40" y="579" font-size="11.5" fill="#4A4A4A">Controls band shares the row with stock (oversized 100 × 110 tap zone, count badge), enlarged waste card, and Undo / Hint pills. No element below 44 pt; nothing is in the bottom 22 pt (home indicator).</text>
<text x="40" y="596" font-size="11.5" fill="#4A4A4A">Scaling: all values are fractions of 844 pt width. Fluid from 640 × 320 (cards 53 × 74 — still above 44 pt) to 932 × 430 (cards 77 × 108). Portrait → pause + rotate prompt; never reflow.</text>
